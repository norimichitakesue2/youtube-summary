# 監視対象YouTubeチャンネルのリスト
#
# 新しいチャンネルを追加するには、下記の形式で - 始まりのブロックを足すだけ：
#
#   - name: 表示名（自由）
#     channel_id: UCxxxxxxxxxxxxxxxxxxxxxx  ← YouTubeのchannel ID（UCで始まる）
#     tags: [任意, タグ]                     ← レポートでの絞り込み用（任意）
#     enabled: true                          ← falseにすると一時停止
#
# channel_id の調べ方：
#   1. チャンネルのページを開く（https://www.youtube.com/@xxxxx）
#   2. ページのソースを表示して "channelId" で検索、またはブラウザURLが
#      /channel/UCxxxx 形式ならその UCxxxx の部分
#   3. もしくは scripts/find_channel_id.py "チャンネル名" で検索可能


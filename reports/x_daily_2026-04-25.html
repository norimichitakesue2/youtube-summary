<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Xツイートサマリ 2026-04-25 〜 2026-04-25</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #1da1f2;
    --pos: #34d399;
    --neg: #f87171;
    --topic: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    padding: 32px 48px;
    background: linear-gradient(135deg, #0c4a6e 0%, #164e63 100%);
    border-bottom: 1px solid #334155;
  }
  header h1 { margin: 0 0 8px; font-size: 28px; }
  header .meta { color: #cbd5e1; font-size: 14px; }
  main { padding: 32px 48px; max-width: 1100px; margin: 0 auto; }
  .summary-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--panel);
    padding: 16px 24px;
    border-radius: 8px;
    flex: 1;
    min-width: 180px;
  }
  .stat .num { font-size: 28px; font-weight: 700; color: var(--accent); }
  .stat .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .day { margin-bottom: 40px; }
  .day h2 {
    color: var(--accent);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 8px;
    margin-bottom: 16px;
    font-size: 22px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .day h2 .count {
    font-size: 13px;
    font-weight: normal;
    color: var(--muted);
  }
  .day-summary {
    background: var(--panel);
    padding: 18px 22px;
    border-radius: 10px;
    margin-bottom: 16px;
    border-left: 4px solid var(--accent);
    white-space: pre-wrap;
    color: #cbd5e1;
  }
  .pos-neg-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  @media (max-width: 700px) { .pos-neg-grid { grid-template-columns: 1fr; } }
  .pos, .neg {
    background: var(--panel-2);
    border-radius: 8px;
    padding: 12px 16px;
  }
  .pos { border-left: 3px solid var(--pos); }
  .neg { border-left: 3px solid var(--neg); }
  .pos .label, .neg .label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .pos .label { color: var(--pos); }
  .neg .label { color: var(--neg); }
  .pos ul, .neg ul { margin: 0; padding-left: 18px; }
  .topics { margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  .topic {
    background: rgba(251, 191, 36, 0.15);
    color: var(--topic);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
  }
  .hot-tweets-label {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .tweet {
    background: var(--panel);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 8px;
    border-left: 3px solid var(--accent);
    font-size: 14px;
  }
  .tweet .author {
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
    font-size: 13px;
  }
  .tweet .text { color: #cbd5e1; white-space: pre-wrap; word-break: break-word; }
  .tweet .stats {
    color: var(--muted);
    font-size: 11px;
    margin-top: 6px;
  }
  .tweet a { color: var(--accent); text-decoration: none; }
  .tweet a:hover { text-decoration: underline; }
  .empty-note { color: var(--muted); font-size: 13px; font-style: italic; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 24px;
    border-top: 1px solid #334155;
  }
</style>
</head>
<body>
<header>
  <h1>Xツイートサマリ</h1>
  <div class="meta">対象期間: 2026-04-25 〜 2026-04-25（1日間） / 生成日時: 2026-04-25 19:03</div>
</header>
<main>
  <div class="summary-stats">
    <div class="stat"><div class="num">0</div><div class="label">ツイート総数</div></div>
    <div class="stat"><div class="num">0</div><div class="label">対象日数</div></div>
    <div class="stat"><div class="num">0</div><div class="label">ポジ要素（合計）</div></div>
    <div class="stat"><div class="num">0</div><div class="label">ネガ要素（合計）</div></div>
  </div>
  <p style="color:#94a3b8">この期間のサマリはまだありません。</p>
</main>
<footer>generated by youtube-summary (X module)</footer>
</body>
</html>
